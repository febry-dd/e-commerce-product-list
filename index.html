<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List - E-Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Product Store</h1>
        <p>Daftar Produk E-Commerce</p>
    </header>

    <main>
        <section class="filter-section">
            <h2>Filter Produk</h2>
            <div class="filter-buttons">
                <button onclick="filterProducts('Semua')">Semua</button>
                <button onclick="filterProducts('Elektronik')">Elektronik</button>
                <button onclick="filterProducts('Fashion')">Fashion</button>
                <button onclick="filterProducts('Aksesoris')">Aksesoris</button>
            </div>
        </section>

        <section>
            <h2>Daftar Produk</h2>
            <div id="product-list" class="product-container"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
